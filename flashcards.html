<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Anatomy & Physiology - Interactive Flashcards</title>
<style>
  :root {
    --bg-color: #0f172a;
    --card-bg: #1e293b;
    --accent-color: #38bdf8;
    --text-color: #f8fafc;
  }
  body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background-color: var(--bg-color);
    color: var(--text-color);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    margin: 0;
    padding: 20px;
    box-sizing: border-box;
    transition: background-color 0.5s ease;
  }
  .chapter-nav {
    display: flex;
    gap: 8px;
    margin-bottom: 20px;
    flex-wrap: wrap;
    justify-content: center;
  }
  .ch-btn {
    background-color: var(--card-bg);
    color: var(--text-color);
    border: 2px solid var(--accent-color);
    padding: 8px 14px;
    font-size: 0.9rem;
    border-radius: 20px;
    cursor: pointer;
    font-weight: bold;
    transition: all 0.2s ease;
  }
  .ch-btn.active {
    background-color: var(--accent-color);
    color: #0f172a;
  }
  .header {
    text-align: center;
    margin-bottom: 20px;
  }
  .header h1 {
    font-size: 1.6rem;
    margin: 0;
    color: var(--accent-color);
  }
  .progress {
    font-size: 1rem;
    margin-top: 5px;
    opacity: 0.8;
  }
  .flashcard-container {
    width: 90%;
    max-width: 600px;
    height: 320px;
    perspective: 1000px;
    cursor: pointer;
  }
  .flashcard {
    width: 100%;
    height: 100%;
    position: relative;
    transform-style: preserve-3d;
    transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
    border-radius: 16px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.4);
  }
  .flashcard.flipped {
    transform: rotateY(180deg);
  }
  .card-face {
    position: absolute;
    width: 100%;
    height: 100%;
    backface-visibility: hidden;
    border-radius: 16px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: 25px;
    box-sizing: border-box;
    text-align: center;
    background-color: var(--card-bg);
    border: 2px solid var(--accent-color);
    transition: background-color 0.5s ease, border-color 0.5s ease;
  }
  .card-back {
    transform: rotateY(180deg);
  }
  .card-label {
    position: absolute;
    top: 15px;
    left: 20px;
    font-size: 0.8rem;
    font-weight: bold;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--accent-color);
  }
  .card-text {
    font-size: 1.2rem;
    line-height: 1.5;
  }
  .controls {
    margin-top: 25px;
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    justify-content: center;
  }
  button {
    background-color: var(--card-bg);
    color: var(--text-color);
    border: 2px solid var(--accent-color);
    padding: 10px 20px;
    font-size: 0.95rem;
    border-radius: 8px;
    cursor: pointer;
    font-weight: bold;
    transition: all 0.2s ease;
  }
  button:hover {
    background-color: var(--accent-color);
    color: #0f172a;
  }
  .btn-dashboard {
    background-color: #10b981;
    border-color: #10b981;
    color: #0b132b;
  }
  .btn-dashboard:hover {
    background-color: #059669;
    border-color: #059669;
    color: white;
  }
</style>
</head>
<body>

<div class="chapter-nav">
  <button class="ch-btn active" id="btn-ch1" onclick="switchChapter(1)">Ch 1: A&P</button>
  <button class="ch-btn" id="btn-ch2" onclick="switchChapter(2)">Ch 2: Chemistry</button>
  <button class="ch-btn" id="btn-ch3" onclick="switchChapter(3)">Ch 3: Cell</button>
  <button class="ch-btn" id="btn-ch4" onclick="switchChapter(4)">Ch 4: Cell Transport</button>
  <button class="btn-dashboard" onclick="location.href='index.html'">🏠 Back to Dashboard</button>
</div>

<div class="header">
  <h1 id="chapter-title">Chapter 1: Human Anatomy & Physiology</h1>
  <div class="progress" id="progress">Card 1 / 116</div>
</div>

<div class="flashcard-container" onclick="flipCard()">
  <div class="flashcard" id="card">
    <div class="card-face card-front">
      <div class="card-label">Question</div>
      <div class="card-text" id="question">Loading...</div>
    </div>
    <div class="card-face card-back">
      <div class="card-label">Answer</div>
      <div class="card-text" id="answer">Loading...</div>
    </div>
  </div>
</div>

<div class="controls">
  <button onclick="prevCard(event)">Previous</button>
  <button onclick="nextCard(event)">Next</button>
</div>

const themes = [
  { bg: "#0f172a", cardBg: "#1e293b", accent: "#38bdf8", text: "#f8fafc" },
  { bg: "#14532d", cardBg: "#064e3b", accent: "#4ade80", text: "#f0fdf4" },
  { bg: "#581c87", cardBg: "#3b0764", accent: "#c084fc", text: "#faf5ff" },
  { bg: "#7c2d12", cardBg: "#451a03", accent: "#fb923c", text: "#fff7ed" },

  { bg: "#1e3a8a", cardBg: "#172554", accent: "#60a5fa", text: "#eff6ff" }
];

let currentChapter = 1;
let currentIndex = 0;
let currentThemeIndex = 0;

function updateCard() {
  const currentCards = chapters[currentChapter].cards;
  document.getElementById('chapter-title').innerText = chapters[currentChapter].title;
  document.getElementById('question').innerText = currentCards[currentIndex].q;
  document.getElementById('answer').innerText = currentCards[currentIndex].a;
  document.getElementById('progress').innerText = `Card ${currentIndex + 1} / ${currentCards.length}`;
  
  const card = document.getElementById('card');
  card.classList.remove('flipped');
}

function flipCard() {
  const card = document.getElementById('card');
  card.classList.toggle('flipped');

  currentThemeIndex = (currentThemeIndex + 1) % themes.length;
  const theme = themes[currentThemeIndex];
  
  document.documentElement.style.setProperty('--bg-color', theme.bg);
  document.documentElement.style.setProperty('--card-bg', theme.cardBg);
  document.documentElement.style.setProperty('--accent-color', theme.accent);
  document.documentElement.style.setProperty('--text-color', theme.text);
}

function nextCard(event) {
  if (event) event.stopPropagation();
  const currentCards = chapters[currentChapter].cards;
  if (currentIndex === currentCards.length - 1) {
    if (confirm(`Great job! You finished Chapter ${currentChapter}. Return to Dashboard?`)) {
      window.location.href = 'index.html';
      return;
    }
  }
  currentIndex = (currentIndex + 1) % currentCards.length;
  updateCard();
}

function prevCard(event) {
  if (event) event.stopPropagation();
  const currentCards = chapters[currentChapter].cards;
  currentIndex = (currentIndex - 1 + currentCards.length) % currentCards.length;
  updateCard();
}

function switchChapter(chNum) {
  currentChapter = chNum;
  currentIndex = 0;
  
  for (let i = 1; i <= 4; i++) {
    const btn = document.getElementById(`btn-ch${i}`);
    if (btn) btn.classList.toggle('active', i === chNum);
  }
  
  updateCard();
}

document.addEventListener('keydown', (e) => {
  if (e.code === 'Space') flipCard();
  if (e.code === 'ArrowRight') nextCard();
  if (e.code === 'ArrowLeft') prevCard();
});

updateCard();
</script>

</body>
</html>

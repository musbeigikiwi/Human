<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Anatomy & Physiology - Interactive Flashcards</title>
<style>
  :root {
    --bg-color: #0f172a;
    --card-bg: #1e293b;
    --accent-color: #38bdf8;
    --text-color: #f8fafc;
  }
  body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background-color: var(--bg-color);
    color: var(--text-color);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    margin: 0;
    padding: 20px;
    box-sizing: border-box;
    transition: background-color 0.5s ease;
  }
  .chapter-nav {
    display: flex;
    gap: 8px;
    margin-bottom: 20px;
    flex-wrap: wrap;
    justify-content: center;
  }
  .ch-btn {
    background-color: var(--card-bg);
    color: var(--text-color);
    border: 2px solid var(--accent-color);
    padding: 8px 14px;
    font-size: 0.9rem;
    border-radius: 20px;
    cursor: pointer;
    font-weight: bold;
    transition: all 0.2s ease;
  }
  .ch-btn.active {
    background-color: var(--accent-color);
    color: #0f172a;
  }
  .header {
    text-align: center;
    margin-bottom: 20px;
  }
  .header h1 {
    font-size: 1.6rem;
    margin: 0;
    color: var(--accent-color);
  }
  .progress {
    font-size: 1rem;
    margin-top: 5px;
    opacity: 0.8;
  }
  .flashcard-container {
    width: 90%;
    max-width: 600px;
    height: 320px;
    perspective: 1000px;
    cursor: pointer;
  }
  .flashcard {
    width: 100%;
    height: 100%;
    position: relative;
    transform-style: preserve-3d;
    transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
    border-radius: 16px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.4);
  }
  .flashcard.flipped {
    transform: rotateY(180deg);
  }
  .card-face {
    position: absolute;
    width: 100%;
    height: 100%;
    backface-visibility: hidden;
    border-radius: 16px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: 25px;
    box-sizing: border-box;
    text-align: center;
    background-color: var(--card-bg);
    border: 2px solid var(--accent-color);
    transition: background-color 0.5s ease, border-color 0.5s ease;
  }
  .card-back {
    transform: rotateY(180deg);
  }
  .card-label {
    position: absolute;
    top: 15px;
    left: 20px;
    font-size: 0.8rem;
    font-weight: bold;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--accent-color);
  }
  .card-text {
    font-size: 1.2rem;
    line-height: 1.5;
  }
  .controls {
    margin-top: 25px;
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    justify-content: center;
  }
  button {
    background-color: var(--card-bg);
    color: var(--text-color);
    border: 2px solid var(--accent-color);
    padding: 10px 20px;
    font-size: 0.95rem;
    border-radius: 8px;
    cursor: pointer;
    font-weight: bold;
    transition: all 0.2s ease;
  }
  button:hover {
    background-color: var(--accent-color);
    color: #0f172a;
  }
  .btn-dashboard {
    background-color: #10b981;
    border-color: #10b981;
    color: #0b132b;
  }
  .btn-dashboard:hover {
    background-color: #059669;
    border-color: #059669;
    color: white;
  }
</style>
</head>
<body>

<!-- Navigation Header -->
<div class="chapter-nav">
  <button class="ch-btn active" id="btn-ch1" onclick="switchChapter(1)">Ch 1: A&P</button>
  <button class="ch-btn" id="btn-ch2" onclick="switchChapter(2)">Ch 2: Chemistry</button>
  <button class="ch-btn" id="btn-ch3" onclick="switchChapter(3)">Ch 3: Cell</button>
  <button class="ch-btn" id="btn-ch4" onclick="switchChapter(4)">Ch 4: Cell Transport</button>
  <button class="btn-dashboard" onclick="location.href='index.html'">🏠 Back to Dashboard</button>
</div>

<div class="header">
  <h1 id="chapter-title">Chapter 1: Human Anatomy & Physiology</h1>
  <div class="progress" id="progress">Card 1 / 116</div>
</div>

<div class="flashcard-container" onclick="flipCard()">
  <div class="flashcard" id="card">
    <div class="card-face card-front">
      <div class="card-label">Question</div>
      <div class="card-text" id="question">Loading...</div>
    </div>
    <div class="card-face card-back">
      <div class="card-label">Answer</div>
      <div class="card-text" id="answer">Loading...</div>
    </div>
  </div>
</div>

<div class="controls">
  <button onclick="prevCard(event)">Previous</button>
  <button onclick="nextCard(event)">Next</button>
</div>

<script>
const chapters = {
  1: {
    title: "Chapter 1: Human Anatomy & Physiology",
    cards: [
      { q: "What is Anatomy?", a: "The study of the structure, shape, and position of body parts and their relationships to one another." },
      { q: "What is Physiology?", a: "The study of how body parts function and work together." },
      { q: "What is the Māori term for Anatomy?", a: "Mātai tinana" },
      { q: "What is the Māori term for Physiology?", a: "Mātai whaiaroaro" },
      { q: "What is the fundamental relationship between structure and function?", a: "Structure determines function." },
      { q: "What is Gross (Macroscopic) Anatomy?", a: "The study of large, easily observable body structures with the naked eye." },
      { q: "What is Microscopic Anatomy?", a: "The study of body structures too small to be seen without a microscope." },
      { q: "What is Cytology?", a: "The microscopic study of cells." },
      { q: "What is Histology?", a: "The microscopic study of tissues." },
      { q: "List the 6 levels of structural organization from simplest to most complex.", a: "Chemical → Cellular → Tissue → Organ → Organ System → Organismal" },
      { q: "What is the simplest level of structural organization?", a: "Chemical level" },
      { q: "What is the smallest structural and functional unit of life?", a: "Cell" },
      { q: "What is a Tissue?", a: "A group of similar cells working together to perform a specific function." },
      { q: "Name the four primary tissue types in the human body.", a: "Epithelial, Connective, Muscle, Nervous" },
      { q: "What is an Organ?", a: "A structure composed of two or more tissue types that performs specific functions." },
      { q: "How many major organ systems make up the human body?", a: "11 systems" },
      { q: "What is Homeostasis?", a: "The maintenance of a stable, balanced internal environment in the body." },
      { q: "What is Anatomical Position?", a: "Standard reference posture: standing upright, facing forward, arms at sides, palms facing forward, feet flat." },
      { q: "What does Superior (Cranial) mean?", a: "Toward the head or upper part of a structure/body." },
      { q: "What does Inferior (Caudal) mean?", a: "Away from the head or toward the lower part of a structure/body." },
      { q: "What does Anterior (Ventral) mean?", a: "Toward or at the front of the body." },
      { q: "What does Posterior (Dorsal) mean?", a: "Toward or at the back of the body." },
      { q: "What does Medial mean?", a: "Toward or at the midline of the body." },
      { q: "What does Lateral mean?", a: "Away from the midline of the body; on the outer side." },
      { q: "What does Proximal mean?", a: "Closer to the origin of a body part or point of attachment of a limb." },
      { q: "What does Distal mean?", a: "Farther from the origin of a body part or point of attachment of a limb." },
      { q: "How does a Sagittal plane divide the body?", a: "Into left and right parts." },
      { q: "How does a Frontal (Coronal) plane divide the body?", a: "Into anterior (front) and posterior (back) parts." },
      { q: "How does a Transverse (Horizontal) plane divide the body?", a: "Into superior (upper) and inferior (lower) parts." },
      { q: "What are the two major closed body cavities?", a: "Dorsal body cavity and Ventral body cavity" },
      { q: "Name the 4 Abdominopelvic Quadrants.", a: "Right Upper (RUQ), Left Upper (LUQ), Right Lower (RLQ), Left Lower (LLQ)" }
    ]
  },
  2: {
    title: "Chapter 2: Chemistry",
    cards: [
      { q: "What is Chemistry (Mātai matū)?", a: "The study of matter, its building blocks, and how they interact." },
      { q: "What is an Atom?", a: "The basic building block of all matter." },
      { q: "What is an Element (Pūmotu)?", a: "A pure substance made up of only one type of atom." },
      { q: "What are the three subatomic particles in an atom?", a: "Protons, Neutrons, and Electrons." },
      { q: "What is the location and charge of a Proton?", a: "Nucleus; Positive (+1) charge." },
      { q: "What is the location and charge of a Neutron?", a: "Nucleus; Neutral (0) charge." },
      { q: "What is the location and charge of an Electron?", a: "Electron shells; Negative (−1) charge." },
      { q: "Which 4 elements make up ~96% of human body mass?", a: "Carbon (C), Oxygen (O), Hydrogen (H), Nitrogen (N)." },
      { q: "What is a Covalent Bond?", a: "A chemical bond formed when atoms share electrons." },
      { q: "What is an Ionic Bond?", a: "A chemical bond formed when electrons are transferred from one atom to another." },
      { q: "What is a Cation?", a: "A positively charged ion (lost electrons)." },
      { q: "What is an Anion?", a: "A negatively charged ion (gained electrons)." },
      { q: "What are Electrolytes?", a: "Ions dissolved in body fluids that conduct electrical currents." },
      { q: "What does the pH scale measure?", a: "The concentration of Hydrogen ions (H⁺) in a solution." },
      { q: "What is the normal pH range for human arterial blood?", a: "7.35 to 7.45 (slightly alkaline)." },
      { q: "What is Denaturation?", a: "Loss of a protein's 3D shape caused by heat or extreme pH, rendering it non-functional." }
    ]
  },
  3: {
    title: "Chapter 3: Cell",
    cards: [
      { q: "What is a Cell?", a: "The basic structural and functional unit of all living organisms." },
      { q: "What are the three main regions of a generalised human cell?", a: "Plasma Membrane, Cytoplasm, and Nucleus." },
      { q: "What is the primary function of the Nucleus?", a: "Contains genetic material (DNA) and controls cellular activities." },
      { q: "What is the Mitochondria known for?", a: "The 'powerhouse' of the cell; produces ATP energy via cellular respiration." },
      { q: "What is the function of Ribosomes?", a: "Sites of protein synthesis in the cell." },
      { q: "What is the Rough Endoplasmic Reticulum (RER)?", a: "Studded with ribosomes; folds and modifies proteins." },
      { q: "What is the Smooth Endoplasmic Reticulum (SER)?", a: "Synthesizes lipids, detoxifies drugs and toxins." },
      { q: "What is the function of the Golgi Apparatus?", a: "Modifies, packages, and sorts proteins for delivery or secretion." },
      { q: "What are Lysosomes?", a: "Organelles containing digestive enzymes to break down waste and cellular debris." },
      { q: "What is the Cytoskeleton?", a: "A network of protein filaments that maintains cell shape and enables movement." }
    ]
  },
  4: {
    title: "Chapter 4: Cell Transport",
    cards: [
      { q: "What is the Plasma Membrane structure called?", a: "Phospholipid Bilayer (hydrophilic heads, hydrophobic tails)." },
      { q: "What does Selective Permeability mean?", a: "Allows certain substances to pass through while restricting others." },
      { q: "What is Passive Transport?", a: "Movement of substances down a concentration gradient without requiring cellular energy (ATP)." },
      { q: "What is Diffusion?", a: "Movement of particles from an area of higher concentration to lower concentration." },
      { q: "What is Osmosis?", a: "Passive movement of water molecules across a selectively permeable membrane." },
      { q: "What is Facilitated Diffusion?", a: "Passive transport across a membrane with the help of channel or carrier proteins." },
      { q: "What is Active Transport?", a: "Movement of substances against a concentration gradient, requiring energy (ATP)." },
      { q: "What is an Isotonic Solution?", a: "A solution with the same solute concentration as the cell (no net water movement)." },
      { q: "What happens to a red blood cell in a Hypertonic solution?", a: "Water leaves the cell, causing it to shrink/crenate." },
      { q: "What happens to a red blood cell in a Hypotonic solution?", a: "Water enters the cell, causing it to swell and potentially burst (lyse)." },
      { q: "What is Endocytosis?", a: "Active transport process where the cell engulfs external materials into vesicles." },
      { q: "What is Exocytosis?", a: "Active transport process where vesicles fuse with the plasma membrane to release contents outside." }
    ]
  }
};

const themes = [
  { bg: "#0f172a", cardBg: "#1e293b", accent: "#38bdf8", text: "#f8fafc" },
  { bg: "#14532d", cardBg: "#064e3b", accent: "#4ade80", text: "#f0fdf4" },
  { bg: "#581c87", cardBg: "#3b0764", accent: "#c084fc", text: "#faf5ff" },
  { bg: "#7c2d12", cardBg: "#451a03", accent: "#fb923c", text: "#fff7ed" },
  { bg: "#831843", cardBg: "#500724", accent: "#f472b6", text: "#fdf2f8" },
  { bg: "#1e3a8a", cardBg: "#172554", accent: "#60a5fa", text: "#eff6ff" }
];

let currentChapter = 1;
let currentIndex = 0;
let currentThemeIndex = 0;

function updateCard() {
  const currentCards = chapters[currentChapter].cards;
  document.getElementById('chapter-title').innerText = chapters[currentChapter].title;
  document.getElementById('question').innerText = currentCards[currentIndex].q;
  document.getElementById('answer').innerText = currentCards[currentIndex].a;
  document.getElementById('progress').innerText = `Card ${currentIndex + 1} / ${currentCards.length}`;
  
  const card = document.getElementById('card');
  card.classList.remove('flipped');
}

function flipCard() {
  const card = document.getElementById('card');
  card.classList.toggle('flipped');

  currentThemeIndex = (currentThemeIndex + 1) % themes.length;
  const theme = themes[currentThemeIndex];
  
  document.documentElement.style.setProperty('--bg-color', theme.bg);
  document.documentElement.style.setProperty('--card-bg', theme.cardBg);
  document.documentElement.style.setProperty('--accent-color', theme.accent);
  document.documentElement.style.setProperty('--text-color', theme.text);
}

function nextCard(event) {
  if (event) event.stopPropagation();
  const currentCards = chapters[currentChapter].cards;
  if (currentIndex === currentCards.length - 1) {
    if (confirm(`Great job! You finished Chapter ${currentChapter}. Return to Dashboard?`)) {
      window.location.href = 'index.html';
      return;
    }
  }
  currentIndex = (currentIndex + 1) % currentCards.length;
  updateCard();
}

function prevCard(event) {
  if (event) event.stopPropagation();
  const currentCards = chapters[currentChapter].cards;
  currentIndex = (currentIndex - 1 + currentCards.length) % currentCards.length;
  updateCard();
}

function switchChapter(chNum) {
  currentChapter = chNum;
  currentIndex = 0;
  
  for (let i = 1; i <= 4; i++) {
    const btn = document.getElementById(`btn-ch${i}`);
    if (btn) btn.classList.toggle('active', i === chNum);
  }
  
  updateCard();
}

document.addEventListener('keydown', (e) => {
  if (e.code === 'Space') flipCard();
  if (e.code === 'ArrowRight') nextCard();
  if (e.code === 'ArrowLeft') prevCard();
});

updateCard();
</script>

</body>
</html>

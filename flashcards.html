<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A&P Interactive Flashcards Hub</title>
  <style>
    :root {
      --primary-dark: #0f172a;
      --accent: #6366f1;
      --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      --text-main: #f8fafc;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: var(--bg-gradient);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 30px 20px;
    }

    header {
      text-align: center;
      margin-bottom: 25px;
    }

    h1 {
      font-size: 2.2rem;
      font-weight: 800;
      background: linear-gradient(to right, #38bdf8, #818cf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 8px;
    }

    p.subtitle {
      color: #94a3b8;
      font-size: 0.95rem;
    }

    .top-bar {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      margin-bottom: 30px;
      width: 100%;
      max-width: 650px;
    }

    select, button {
      padding: 12px 20px;
      font-size: 0.95rem;
      font-weight: 600;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      outline: none;
    }

    select {
      background: #1e293b;
      color: #f8fafc;
      border: 1px solid #334155;
      flex: 1;
      min-width: 240px;
    }

    select:hover {
      border-color: var(--accent);
    }

    .btn {
      background: #1e293b;
      color: #f8fafc;
      border: 1px solid #334155;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .btn:hover {
      background: var(--accent);
      border-color: var(--accent);
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(99, 102, 241, 0.35);
    }

    .btn-dashboard {
      background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
      color: #ffffff;
      border: none;
    }

    .btn-dashboard:hover {
      background: linear-gradient(135deg, #0369a1 0%, #075985 100%);
      box-shadow: 0 4px 12px rgba(2, 132, 199, 0.4);
    }

    .card-container {
      width: 100%;
      max-width: 650px;
      height: 380px;
      perspective: 1200px;
      margin-bottom: 25px;
    }

    .card {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
      cursor: pointer;
      border-radius: 24px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
    }

    .card.flipped {
      transform: rotateY(180deg);
    }

    .card-face {
      position: absolute;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      border-radius: 24px;
      padding: 40px 30px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      text-align: center;
      transition: background 0.5s ease;
    }

    .card-front {
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.15);
    }

    .card-back {
      transform: rotateY(180deg);
      background: #0f172a !important;
      color: #38bdf8;
      border: 2px solid #38bdf8;
    }

    .card-badge {
      font-size: 0.75rem;
      letter-spacing: 1.5px;
      font-weight: 700;
      text-transform: uppercase;
      padding: 6px 14px;
      border-radius: 20px;
      background: rgba(0, 0, 0, 0.25);
      backdrop-filter: blur(4px);
    }

    .card-text {
      font-size: 1.35rem;
      font-weight: 600;
      line-height: 1.5;
      margin: auto 0;
    }

    .card-hint {
      font-size: 0.8rem;
      opacity: 0.75;
    }

    .bottom-nav {
      display: flex;
      gap: 20px;
      align-items: center;
    }

    .progress-pill {
      background: #1e293b;
      padding: 8px 18px;
      border-radius: 20px;
      font-size: 0.9rem;
      font-weight: 700;
      color: #94a3b8;
      border: 1px solid #334155;
    }
  </style>
</head>
<body>

  <header>
    <h1>A&P Mastery Flashcards</h1>
    <p class="subtitle">Press Space to flip | Use Arrow keys to navigate</p>
  </header>

  <div class="top-bar">
    <button class="btn btn-dashboard" onclick="resetToDashboard()">🏠 Back To Dashboard</button>
    <select id="chapterSelect" onchange="changeChapter()">
      <option value="all">All Chapters (450 Cards)</option>
      <option value="ch1">Chapter 1: Intro to A&P (Cards 1–150)</option>
      <option value="ch2">Chapter 2: Chemistry & Lab (Cards 151–300)</option>
      <option value="ch3">Chapter 3: Cell Biology (Cards 301–450)</option>
      <option value="ch4">Chapter 4: Cell Transport (Cards 451–600)</option>
    </select>
    <button class="btn" onclick="shuffleCards()">🎲 Shuffle</button>
  </div>

  <div class="card-container" onclick="flipCard()">
    <div class="card" id="flashcard">
      <div class="card-face card-front" id="cardFront">
        <span class="card-badge">QUESTION</span>
        <div class="card-text" id="questionText">Loading...</div>
        <span class="card-hint">Click or press Space to reveal answer 🔄</span>
      </div>
      <div class="card-face card-back">
        <span class="card-badge" style="background: rgba(56, 189, 248, 0.15);">ANSWER</span>
        <div class="card-text" id="answerText">Loading...</div>
        <span class="card-hint">Click to flip back 🔄</span>
      </div>
    </div>
  </div>

  <div class="bottom-nav">
    <button class="btn" onclick="prevCard()">◀ Previous</button>
    <div class="progress-pill" id="progressText">1 / 450</div>
    <button class="btn" onclick="nextCard()">Next ▶</button>
  </div>

  <script>
    // Colorful background gradients for vibrant visual feedback
    const cardGradients = [
      "linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%)",
      "linear-gradient(135deg, #0284c7 0%, #2563eb 100%)",
      "linear-gradient(135deg, #0d9488 0%, #0284c7 100%)",
      "linear-gradient(135deg, #d97706 0%, #dc2626 100%)",
      "linear-gradient(135deg, #7c3aed 0%, #db2777 100%)",
      "linear-gradient(135deg, #059669 0%, #0d9488 100%)"
    ];

    const rawData = [
      // Chapter 1
      { q: "What is anatomy?", a: "The study of the structure, shape, and position of the body and its parts.", ch: "ch1" },
      { q: "What is physiology?", a: "The study of how the body and its parts function and work.", ch: "ch1" },
      { q: "What is the relationship between structure and function?", a: "Structure determines function.", ch: "ch1" },
      { q: "What is microscopic anatomy?", a: "The study of body structures that cannot be seen with the naked eye.", ch: "ch1" },
      { q: "What is gross (macroscopic) anatomy?", a: "The study of large, easily visible body structures without using a microscope.", ch: "ch1" },
      { q: "What is cytology?", a: "The scientific study of cells.", ch: "ch1" },
      { q: "What is histology?", a: "The scientific study of tissues.", ch: "ch1" },
      { q: "What is developmental anatomy?", a: "The study of structural changes that occur in an organism throughout its lifespan.", ch: "ch1" },
      { q: "What is embryology?", a: "The study of development before birth (from week 8 to 38 in utero).", ch: "ch1" },
      { q: "What is the prefix 'micro-'?", a: "Small, requiring a microscope.", ch: "ch1" },
      { q: "What is the prefix 'macro-'?", a: "Large.", ch: "ch1" },
      { q: "What does the suffix '-ology' mean?", a: "Study of.", ch: "ch1" },
      { q: "Is observing heart tissue under a microscope anatomy or physiology?", a: "Anatomy (Microscopic Anatomy / Histology).", ch: "ch1" },
      { q: "Is observing how the heart contracts to pump blood anatomy or physiology?", a: "Physiology.", ch: "ch1" },
      { q: "Is listening to heart sounds (auscultation) an investigation of anatomy or physiology?", a: "Physiology.", ch: "ch1" },
      { q: "Is palpating (feeling) a muscle an investigation of anatomy or physiology?", a: "Anatomy.", ch: "ch1" },
      { q: "Is measuring a joint's range of motion an assessment of anatomy or physiology?", a: "Physiology.", ch: "ch1" },
      { q: "Is noting that the stomach is in the upper left abdominal cavity anatomy or physiology?", a: "Anatomy.", ch: "ch1" },
      { q: "Is noting that the liver detoxifies drugs anatomy or physiology?", a: "Physiology.", ch: "ch1" },
      { q: "Is recording skin color an observation of anatomy or physiology?", a: "Anatomy.", ch: "ch1" },
      { q: "Is stating that the eye has a cornea, lens, and retina anatomy or physiology?", a: "Anatomy.", ch: "ch1" },
      { q: "Is stating that the iris controls light entering the eye anatomy or physiology?", a: "Physiology.", ch: "ch1" },
      { q: "What does 'structure' mean in A&P?", a: "The shape, location, and arrangement of body parts.", ch: "ch1" },
      { q: "What does 'function' mean in A&P?", a: "What a body part does / its specific job.", ch: "ch1" },
      { q: "Why do healthcare professionals learn scientific language?", a: "To communicate clearly about body structures, functions, and clinical decisions.", ch: "ch1" },
      { q: "What are the 6 levels of structural organization in order from simplest to most complex?", a: "Chemical level → Cellular level → Tissue level → Organ level → Organ system level → Organism level.", ch: "ch1" },
      { q: "What is the chemical level?", a: "The simplest level where atoms join to form molecules.", ch: "ch1" },
      { q: "What are atoms?", a: "The smallest units of matter that join together to form molecules.", ch: "ch1" },
      { q: "What is the most abundant molecule in the human body?", a: "Water.", ch: "ch1" },
      { q: "Give 3 examples of molecules in the human body.", a: "Water, carbon dioxide, and glucose.", ch: "ch1" },
      { q: "What is the cellular level?", a: "Molecules join to form organelles and cells, the basic structural and functional units of life.", ch: "ch1" },
      { q: "What are organelles?", a: "Specialized structures inside a cell that perform specific functions.", ch: "ch1" },
      { q: "Give 3 examples of cell types in the body.", a: "Red blood cells, smooth muscle cells, and nerve cells (neurons).", ch: "ch1" },
      { q: "What is a cell?", a: "The smallest living functional unit in a living organism.", ch: "ch1" },
      { q: "How many different cell types are roughly in the human body?", a: "Around 250 different types.", ch: "ch1" },
      { q: "What is the tissue level?", a: "Groups of similar cells that work together to perform a common function.", ch: "ch1" },
      { q: "What are the 4 main types of tissues in the human body?", a: "Epithelial tissue, Connective tissue, Muscle tissue, and Nervous tissue.", ch: "ch1" },
      { q: "What is the primary function of epithelial tissue?", a: "Covers body surfaces and lines hollow organs and cavities.", ch: "ch1" },
      { q: "What is the primary function of connective tissue?", a: "Supports, protects, and binds body organs.", ch: "ch1" },
      { q: "What is the primary function of muscle tissue?", a: "Contracts to produce movement of the body or substances through the body.", ch: "ch1" },
      { q: "What is the primary function of nervous tissue?", a: "Generates and transmits electrical impulses for communication.", ch: "ch1" },
      { q: "What is the organ level?", a: "Two or more different tissue types joined together to perform specific, complex functions.", ch: "ch1" },
      { q: "Is the skin an organ?", a: "Yes, it is the largest organ of the body.", ch: "ch1" },
      { q: "What is the organ system level?", a: "A group of organs working closely together to perform a major body function.", ch: "ch1" },
      { q: "What is the organism level?", a: "The highest level; the sum total of all organ systems working together to maintain life.", ch: "ch1" },
      { q: "How many major organ systems make up the human body?", a: "11 major organ systems.", ch: "ch1" },
      { q: "What is the overall function of the Integumentary System?", a: "Forms the external body covering, protects deeper tissues, retains water, and regulates temperature.", ch: "ch1" },
      { q: "What organs make up the Integumentary System?", a: "Skin, hair, nails, and sweat/oil glands.", ch: "ch1" },
      { q: "What is the overall function of the Skeletal System?", a: "Protects and supports organs, provides a framework for muscle attachment, forms blood cells, and stores minerals.", ch: "ch1" },
      { q: "What are the main organs/structures of the Skeletal System?", a: "Bones, joints, cartilages, and ligaments.", ch: "ch1" },
      { q: "What is the overall function of the Muscular System?", a: "Produces movement, maintains posture, and generates body heat.", ch: "ch1" },
      { q: "What is the overall function of the Nervous System?", a: "Fast-acting control and communication system that responds to internal and external changes.", ch: "ch1" },
      { q: "What organs make up the Nervous System?", a: "Brain, spinal cord, nerves, and sensory receptors.", ch: "ch1" },
      { q: "What is the overall function of the Endocrine System?", a: "Controls body activities slowly by secreting hormones into the blood.", ch: "ch1" },
      { q: "What are some major glands of the Endocrine System?", a: "Pituitary, thyroid, pancreas, adrenal, ovaries, and testes.", ch: "ch1" },
      { q: "What is the overall function of the Cardiovascular System?", a: "Pumps and transports blood to deliver oxygen/nutrients and remove carbon dioxide/wastes.", ch: "ch1" },
      { q: "What organs make up the Cardiovascular System?", a: "Heart and blood vessels.", ch: "ch1" },
      { q: "What is the overall function of the Lymphatic / Immune System?", a: "Returns leaked fluid to blood vessels and houses white blood cells involved in immunity/defence.", ch: "ch1" },
      { q: "What are main organs/structures of the Lymphatic System?", a: "Lymph nodes, lymph vessels, spleen, tonsils, and thymus.", ch: "ch1" },
      { q: "What is the overall function of the Respiratory System?", a: "Keeps blood constantly supplied with oxygen and removes carbon dioxide.", ch: "ch1" },
      { q: "What organs make up the Respiratory System?", a: "Nose, pharynx, larynx, trachea, bronchi, and lungs.", ch: "ch1" },
      { q: "What is the overall function of the Digestive System?", a: "Breaks down food into absorbable nutrients and eliminates indigestible waste as feces.", ch: "ch1" },
      { q: "What organs make up the Digestive System?", a: "Mouth, esophagus, stomach, small intestine, large intestine, liver, and pancreas.", ch: "ch1" },
      { q: "What is the overall function of the Urinary System?", a: "Eliminates nitrogen-containing wastes; regulates water, electrolyte, and acid-base balance.", ch: "ch1" },
      { q: "What organs make up the Urinary System?", a: "Kidneys, ureters, urinary bladder, and urethra.", ch: "ch1" },

      // Chapter 2
      { q: "What is the basic unit of all matter?", a: "An atom.", ch: "ch2" },
      { q: "What are the three subatomic particles in an atom?", a: "Protons, neutrons, and electrons.", ch: "ch2" },
      { q: "Where are protons located in an atom?", a: "In the nucleus.", ch: "ch2" },
      { q: "What is the electrical charge of a proton?", a: "Positive (+).", ch: "ch2" },
      { q: "Where are neutrons located in an atom?", a: "In the nucleus.", ch: "ch2" },
      { q: "What is the electrical charge of a neutron?", a: "Neutral / No charge (0).", ch: "ch2" },
      { q: "Where are electrons located in an atom?", a: "In electron shells / orbitals around the nucleus.", ch: "ch2" },
      { q: "What is the electrical charge of an electron?", a: "Negative (-).", ch: "ch2" },
      { q: "Why is a neutral atom electrically uncharged overall?", a: "Because the number of protons equals the number of electrons.", ch: "ch2" },
      { q: "What is an element?", a: "A pure substance made up of only one type of atom.", ch: "ch2" },
      { q: "Which four elements make up approximately 96% of the human body weight?", a: "Carbon (C), Oxygen (O), Hydrogen (H), and Nitrogen (N).", ch: "ch2" },
      { q: "What does the atomic number of an element represent?", a: "The number of protons in the nucleus of its atom.", ch: "ch2" },
      { q: "What is the atomic symbol for Carbon?", a: "C.", ch: "ch2" },
      { q: "What is the atomic symbol for Oxygen?", a: "O.", ch: "ch2" },
      { q: "What is the atomic symbol for Nitrogen?", a: "N.", ch: "ch2" },
      { q: "What is the atomic symbol for Hydrogen?", a: "H.", ch: "ch2" },
      { q: "What is the atomic symbol for Calcium?", a: "Ca.", ch: "ch2" },
      { q: "What is the atomic symbol for Sodium?", a: "Na (from Latin natrium).", ch: "ch2" },
      { q: "What is the atomic symbol for Chlorine?", a: "Cl.", ch: "ch2" },
      { q: "How many protons does a Carbon atom have?", a: "6.", ch: "ch2" },
      { q: "How many protons does an Oxygen atom have?", a: "8.", ch: "ch2" },
      { q: "How many protons does a Sodium atom have?", a: "11.", ch: "ch2" },
      { q: "How many protons does a Chlorine atom have?", a: "17.", ch: "ch2" },
      { q: "How many electrons can fit into the first (innermost) electron shell?", a: "Up to 2 electrons.", ch: "ch2" },
      { q: "How many electrons can fit into the second electron shell?", a: "Up to 8 electrons.", ch: "ch2" },
      { q: "What is the outer electron shell of an atom called?", a: "The valence shell.", ch: "ch2" },
      { q: "When is an atom considered chemical stable and unreactive?", a: "When its valence shell is completely full.", ch: "ch2" },
      { q: "Why do atoms form chemical bonds with each other?", a: "To fill or empty their outer valence shell and achieve stability.", ch: "ch2" },
      { q: "What is a molecule?", a: "A particle formed when two or more atoms are chemically bonded together.", ch: "ch2" },
      { q: "Which subatomic particles are directly involved in forming chemical bonds?", a: "Electrons.", ch: "ch2" },

      // Chapter 3
      { q: "What are cells?", a: "The basic structural and functional units of all living organisms.", ch: "ch3" },
      { q: "Where do cells fit in the levels of structural organisation of the body?", a: "Chemical → Organelle → Cell → Tissue → Organ → Organ System → Organism.", ch: "ch3" },
      { q: "Approximately how many cells make up the human body?", a: "Around 37 trillion (37 × 10^12) cells.", ch: "ch3" },
      { q: "Approximately how many specialized cell types are in the human body?", a: "About 250 different cell types.", ch: "ch3" },
      { q: "What general physiological principle links cell shape to cell role?", a: "Structure determines function.", ch: "ch3" },
      { q: "What are the three primary generalized parts of a human cell?", a: "Cell membrane, Cytoplasm, and Nucleus.", ch: "ch3" },
      { q: "What is the location of the cell membrane?", a: "Surrounds the outermost boundary of the cell.", ch: "ch3" },
      { q: "List four main functions of the cell membrane.", a: "Physical barrier, cell communication, cell recognition, and selective permeability.", ch: "ch3" },

      // Chapter 4
      { q: "What is cell transport?", a: "The movement of substances into and out of a cell across its cell membrane.", ch: "ch4" },
      { q: "What are the two major categories of cell transport mechanisms?", a: "Passive transport and Active transport.", ch: "ch4" },
      { q: "What defines passive transport?", a: "Movement of substances across a membrane without any cellular energy (ATP) expenditure.", ch: "ch4" },
      { q: "What defines active transport?", a: "Movement of substances across a membrane requiring cellular energy expenditure (ATP).", ch: "ch4" },
      { q: "List three primary types of passive transport.", a: "Simple diffusion, Facilitated diffusion, and Osmosis.", ch: "ch4" },
      { q: "List three primary types of active transport.", a: "Active transport pumps (e.g., Na+/K+ pump), Endocytosis, and Exocytosis.", ch: "ch4" }
    ];

    let currentCards = [...rawData];
    let currentIndex = 0;

    function renderCard() {
      const cardEl = document.getElementById("flashcard");
      const cardFront = document.getElementById("cardFront");
      
      cardEl.classList.remove("flipped");
      
      // Dynamic background color change for front of the card
      const randomGradient = cardGradients[currentIndex % cardGradients.length];
      cardFront.style.background = randomGradient;

      setTimeout(() => {
        if (currentCards.length > 0) {
          document.getElementById("questionText").innerText = currentCards[currentIndex].q;
          document.getElementById("answerText").innerText = currentCards[currentIndex].a;
          document.getElementById("progressText").innerText = `${currentIndex + 1} / ${currentCards.length}`;
        }
      }, 150);
    }

    function flipCard() {
      document.getElementById("flashcard").classList.toggle("flipped");
    }

    function nextCard() {
      if (currentCards.length === 0) return;
      currentIndex = (currentIndex + 1) % currentCards.length;
      renderCard();
    }

    function prevCard() {
      if (currentCards.length === 0) return;
      currentIndex = (currentIndex - 1 + currentCards.length) % currentCards.length;
      renderCard();
    }

    function changeChapter() {
      const selected = document.getElementById("chapterSelect").value;
      if (selected === "all") {
        currentCards = [...rawData];
      } else {
        currentCards = rawData.filter(card => card.ch === selected);
      }
      currentIndex = 0;
      renderCard();
    }

    function shuffleCards() {
      for (let i = currentCards.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [currentCards[i], currentCards[j]] = [currentCards[j], currentCards[i]];
      }
      currentIndex = 0;
      renderCard();
    }

    function resetToDashboard() {
      document.getElementById("chapterSelect").value = "all";
      currentCards = [...rawData];
      currentIndex = 0;
      renderCard();
    }

    // Keyboard Shortcuts
    document.addEventListener('keydown', function(event) {
      if (event.code === 'ArrowRight') {
        nextCard();
      } else if (event.code === 'ArrowLeft') {
        prevCard();
      } else if (event.code === 'Space') {
        flipCard();
        event.preventDefault();
      }
    });

    renderCard();
  </script>
</body>
</html>
